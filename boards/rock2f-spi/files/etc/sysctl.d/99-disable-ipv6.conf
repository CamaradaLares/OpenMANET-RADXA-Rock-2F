# Disable IPv6 on the AIC8800 WiFi interface only.
#
# The AIC8800 driver has a bug in rwnx_send_mesh_proxy_add_req() which calls
# wait_event_timeout() from atomic context when the interface is in mesh point
# mode. This is triggered by IPv6 MLD multicast packets on the interface.
#
# In the OpenMANET configuration the AIC8800 operates in AP mode only, so the
# crash path is not reached. As a precaution, IPv6 is disabled on the AIC8800
# interface specifically (identified by its UCI name 'ahwlan') to prevent any
# future configuration change from accidentally triggering the bug.
#
# IPv6 remains enabled on all other interfaces (bat0, loopback, eth0) so that
# openmanetd and other IPv6-dependent services work correctly.
net.ipv6.conf.phy1-ap0.disable_ipv6=1
